<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050d1f;
    font-family:Arial,sans-serif;
}

.popupBox{

    width:420px;
    max-width:92%;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.18);

    border-radius:22px;

    padding:35px;

    text-align:center;

    box-shadow:0 0 35px rgba(0,0,0,.45);

}

.popupBox h2{

    color:#fff;
    font-family:'Playfair Display',serif;
    margin-bottom:10px;

}

.popupBox p{

    color:#ddd;
    margin-bottom:18px;

}

input{

    width:100%;
    padding:14px;

    border:none;
    outline:none;

    border-radius:12px;

    margin-bottom:15px;

    font-size:15px;

}

button{

    width:100%;
    padding:14px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    background:#8e44ad;

    color:#fff;

    font-size:16px;

    transition:.3s;

    margin-top:10px;

}

button:hover{

    background:#6c3483;

}

#resultBox{

    display:none;
    margin-top:25px;

}

#inviteLink{

    background:#fff;

}

.copyBtn{

    background:#2980b9;

}

.copyBtn:hover{

    background:#21618c;

}

.viewBtn{

    background:#27ae60;

}

.viewBtn:hover{

    background:#1e8449;

}

</style>
</head>

<body>

<div class="popupBox">

<h2>Create Invitation</h2>

<p>Enter Guest Name</p>

<input
type="text"
id="guestName"
placeholder="Guest Name">

<button onclick="createInvitation()">
Create Invitation
</button>

<div id="resultBox">

<p style="color:#ddd;margin-bottom:10px;">
Invitation Link
</p>

<input
type="text"
id="inviteLink"
readonly>

<button
class="copyBtn"
onclick="copyLink()">
📋 Copy Link
</button>

<button
class="viewBtn"
onclick="viewInvitation()">
👁 View Invitation
</button>

</div>

</div>

<script>

let invitationURL="";

function createInvitation(){

    const guest=document.getElementById("guestName").value.trim();

    if(guest===""){

        alert("Please enter Guest Name");
        return;

    }

    // Current folder path
    const basePath=window.location.href.replace("create.html","index.html");

    invitationURL=
    basePath+
    "?guest="+
    encodeURIComponent(guest);

    document.getElementById("inviteLink").value=
    invitationURL;

    document.getElementById("resultBox").style.display="block";

}

function copyLink(){

    navigator.clipboard.writeText(invitationURL);

    alert("Invitation link copied!");

}

function viewInvitation(){

    window.open(invitationURL,"_blank");

}

</script>

</body>
</html>
